name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  skill-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run skill contract tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate plugin manifests
        run: >-
          jq empty
          .codex-plugin/plugin.json
          .claude-plugin/plugin.json
          .claude-plugin/marketplace.json
          .agents/plugins/marketplace.json

      - name: Check changed-line whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            git diff --check "origin/$BASE_REF...HEAD"
          elif printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            git log --check HEAD
          else
            if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BEFORE_SHA" || true
            fi
            if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              git diff --check "$BEFORE_SHA..HEAD"
            else
              git log --check HEAD
            fi
          fi
